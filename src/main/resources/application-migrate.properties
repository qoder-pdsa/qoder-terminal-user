# Used by `make db-migrate`: run Flyway migrations and exit without starting the web server
spring.main.web-application-type=none
spring.flyway.enabled=true
# Lazy initialization: only the data source and Flyway are initialized; business beans (JWT keys, controllers, ...) are not created,
# so migrations need only a database connection and do not depend on business config such as USER_JWT_PRIVATE_KEY
spring.main.lazy-initialization=true
