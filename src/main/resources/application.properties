spring.application.name=qoder-terminal-user
server.port=${USER_PORT:8084}

# 数据库：独占 qoder_user schema
spring.datasource.url=${USER_DB_URL:jdbc:postgresql://localhost:5432/qoder}
spring.datasource.username=${USER_DB_USERNAME:qoder}
spring.datasource.password=${USER_DB_PASSWORD:qoder}
spring.jpa.properties.hibernate.default_schema=qoder_user
spring.jpa.open-in-view=false
# AutoWonder 规则：启动时禁止任何自动建表 / 迁移，数据库变更只能通过 `make db-migrate` 执行
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
spring.flyway.schemas=qoder_user
spring.flyway.default-schema=qoder_user

# JWT
qoder.jwt.issuer=qoder-terminal-user
qoder.jwt.audience=qoder-terminal
qoder.jwt.ttl=${USER_TOKEN_TTL:PT8H}
# PKCS#8 PEM 私钥；生产环境必须配置（来自 KMS 凭据）
qoder.jwt.private-key=${USER_JWT_PRIVATE_KEY:}
# 仅本地开发：未配置私钥时生成临时密钥（重启后旧 token 失效）
qoder.jwt.allow-ephemeral-key=${USER_JWT_ALLOW_EPHEMERAL:false}

# 邀请码：为空时关闭注册
qoder.invite-code=${USER_INVITE_CODE:}

management.endpoints.web.exposure.include=health
